<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101113">
    <title>Digital Silence</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #101113;
        color: #f2f0eb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
      }

      main {
        width: min(100%, 34rem);
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2.5rem, 8vw, 4.5rem);
        font-weight: 500;
        letter-spacing: -0.055em;
        line-height: 1.05;
      }

      p {
        margin: 0 0 2.5rem;
        color: #c5c3bf;
        font-size: 1.05rem;
        line-height: 1.7;
      }

      audio {
        display: block;
        width: 100%;
      }

      audio:focus-visible {
        outline: 2px solid #f2f0eb;
        outline-offset: 5px;
        border-radius: 0.25rem;
      }

      #playback-status {
        min-height: 1.5em;
        margin: 1rem 0 0;
        color: #c5c3bf;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Digital Silence</h1>
      <p>This is an audio story. Put on headphones, click play, and listen until the end.</p>
      <audio id="story-audio" controls preload="metadata" aria-label="Digital Silence audio story">
        <source src="assets/Audio%20story.mp3" type="audio/mpeg">
        Your browser does not support audio playback.
      </audio>
      <p id="playback-status" aria-live="polite"></p>
    </main>
    <script>
      const storyAudio = document.querySelector("#story-audio");
      const playbackStatus = document.querySelector("#playback-status");

      storyAudio.addEventListener("ended", () => {
        playbackStatus.textContent = "Playback complete.";
      });

      storyAudio.addEventListener("play", () => {
        playbackStatus.textContent = "";
      });
    </script>
  </body>
</html>
